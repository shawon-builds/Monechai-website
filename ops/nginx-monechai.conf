# Template: replace example.com and certificate paths; install only after TLS provisioning.
# Use a trusted TLS origin. If Cloudflare sits in front, enable Full (strict) there.
# Included inside nginx's http context. Do not record bearer receipt URLs, query
# strings, cookies or authorization headers in ordinary access logs.
log_format monechai_safe '$time_iso8601 $request_method $server_protocol $status $body_bytes_sent $request_time';
server {
    listen 80;
    server_name shop.example.com;
    access_log /var/log/nginx/monechai-access.log monechai_safe;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl;
    server_name shop.example.com;
    access_log /var/log/nginx/monechai-access.log monechai_safe;
    ssl_certificate /etc/letsencrypt/live/shop.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/shop.example.com/privkey.pem;

    client_max_body_size 8m;
    # Do not enable proxy cache for dynamic/user-specific pages.
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 60s;
    }
}
# Behind Cloudflare: $remote_addr is the Cloudflare edge, NOT the visitor IP,
# unless real_ip_header is configured with the CURRENT official Cloudflare IP ranges.
# Do not trust arbitrary incoming CF-Connecting-IP/X-Forwarded-For headers.
